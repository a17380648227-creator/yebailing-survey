<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 野百灵餐厅</title>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: white;
        }
        .main-container { max-width: 1400px; margin: 0 auto; padding: 40px 30px; }
        .page-header { margin-bottom: 40px; text-align: center; }
        .page-title {
            font-size: 48px; font-weight: 800;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #ef4444 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 12px;
        }
        .page-subtitle { font-size: 16px; color: rgba(255, 255, 255, 0.7); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px; margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px);
            border-radius: 24px; padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(147, 197, 253, 0.2);
            text-align: center; transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(59, 130, 246, 0.3);
        }
        .stat-icon { font-size: 50px; margin-bottom: 15px; }
        .stat-number {
            font-size: 42px; font-weight: bold;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .stat-label { font-size: 15px; color: rgba(255, 255, 255, 0.7); }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .menu-item {
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px);
            border-radius: 24px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(147, 197, 253, 0.2);
            cursor: pointer; transition: all 0.3s;
            text-decoration: none; display: block;
        }
        .menu-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 70px rgba(59, 130, 246, 0.4);
        }
        .menu-icon { font-size: 60px; margin-bottom: 20px; }
        .menu-title {
            font-size: 24px; font-weight: bold; color: white; margin-bottom: 10px;
        }
        .menu-desc { color: rgba(255, 255, 255, 0.7); font-size: 14px; line-height: 1.6; }

        .brand-section {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(147, 197, 253, 0.2);
            margin-bottom: 40px;
        }
        .brand-section-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .brand-stat-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(37, 99, 235, 0.2) 100%);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(59, 130, 246, 0.3);
            transition: all 0.3s;
        }
        .brand-stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.3);
        }
        .brand-stat-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fbbf24;
        }
        .brand-stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .brand-stat-label {
            color: rgba(255, 255, 255, 0.7);
        }
        .brand-stat-value {
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body>
    <script src="navbar.js"></script>
    <script>insertNavbar('admin.html');</script>

    <div class="main-container">
        <div class="page-header">
            <h1 class="page-title">🍴 多品牌餐厅管理后台</h1>
            <p class="page-subtitle">欢迎回来，开始管理您的问卷系统</p>
        </div>

        <!-- 品牌统计区域 -->
        <div class="brand-section">
            <div class="brand-section-title">
                <span>🏢</span>
                <span>品牌概览</span>
            </div>
            <div id="brandStatsContainer" class="brand-cards-grid"></div>
        </div>

        <!-- 总体统计 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🏢</div>
                <div class="stat-number" id="totalBrands">0</div>
                <div class="stat-label">品牌总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏪</div>
                <div class="stat-number" id="totalStores">0</div>
                <div class="stat-label">门店总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-number" id="totalTables">0</div>
                <div class="stat-label">桌位总数</div>
            </div>
            <a href="feedbacks.html" class="stat-card" style="text-decoration: none; color: inherit; display: block;">
                <div class="stat-icon">💬</div>
                <div class="stat-number" id="totalAnswers">0</div>
                <div class="stat-label">收到反馈</div>
            </a>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-number" id="avgRating">0</div>
                <div class="stat-label">平均评分</div>
            </div>
        </div>

        <div class="menu-grid">
            <a href="stores.html" class="menu-item">
                <div class="menu-icon">🏪</div>
                <div class="menu-title">门店管理</div>
                <div class="menu-desc">添加门店、管理桌位、生成二维码</div>
            </a>
            <a href="questionnaire-editor.html" class="menu-item">
                <div class="menu-icon">📝</div>
                <div class="menu-title">问卷编辑</div>
                <div class="menu-desc">自定义问卷问题、样式和轮播图</div>
            </a>
            <a href="data.html" class="menu-item">
                <div class="menu-icon">📊</div>
                <div class="menu-title">数据统计</div>
                <div class="menu-desc">查看顾客反馈、分析数据、导出报表</div>
            </a>
            <a href="feedbacks.html" class="menu-item">
                <div class="menu-icon">💬</div>
                <div class="menu-title">顾客反馈</div>
                <div class="menu-desc">查看、筛选、管理顾客反馈</div>
            </a>
            <a href="backup.html" class="menu-item">
                <div class="menu-icon">💾</div>
                <div class="menu-title">数据备份</div>
                <div class="menu-desc">导出、导入、备份系统数据</div>
            </a>
            <a href="accounts.html" class="menu-item">
                <div class="menu-icon">👥</div>
                <div class="menu-title">账号管理</div>
                <div class="menu-desc">添加管理员账号、管理登录权限</div>
            </a>
            <a href="网站配置.html" class="menu-item">
                <div class="menu-icon">⚙️</div>
                <div class="menu-title">网站配置</div>
                <div class="menu-desc">配置问卷访问地址、二维码生成URL</div>
            </a>
            <a href="配置云端同步.html" class="menu-item">
                <div class="menu-icon">☁️</div>
                <div class="menu-title">云端同步</div>
                <div class="menu-desc">配置GitHub Token、启用跨设备数据同步</div>
            </a>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const brands = JSON.parse(localStorage.getItem('ybl_brands') || '[]');
            const stores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');
            const answers = JSON.parse(localStorage.getItem('ybl_answers') || '[]');

            // 渲染品牌统计卡片
            const brandStatsContainer = document.getElementById('brandStatsContainer');
            if (brands.length === 0) {
                brandStatsContainer.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: rgba(255,255,255,0.6);">
                        <div style="font-size: 48px; margin-bottom: 15px;">🏢</div>
                        <div style="font-size: 18px; margin-bottom: 10px;">还没有品牌</div>
                        <div style="font-size: 14px;">请前往 <a href="stores.html" style="color: #fbbf24; text-decoration: none;">品牌门店管理</a> 添加品牌</div>
                    </div>
                `;
            } else {
                brandStatsContainer.innerHTML = brands.map(brand => {
                    // 统计该品牌的门店数
                    const brandStores = stores.filter(s => s.brandId === brand.id || s.brandName === brand.name);
                    const storeCount = brandStores.length;

                    // 统计该品牌的桌位数
                    const tableCount = brandStores.reduce((sum, s) => sum + (s.tables ? s.tables.length : 0), 0);

                    // 统计该品牌的反馈数
                    const feedbackCount = answers.filter(a => a.brand === brand.name).length;

                    // 统计该品牌的平均评分
                    const brandAnswers = answers.filter(a => a.brand === brand.name && a.rating);
                    const brandAvgRating = brandAnswers.length > 0
                        ? (brandAnswers.reduce((sum, a) => sum + a.rating, 0) / brandAnswers.length).toFixed(1)
                        : '暂无';

                    return `
                        <div class="brand-stat-card">
                            <div class="brand-stat-name">🏢 ${brand.name}</div>
                            <div class="brand-stat-row">
                                <span class="brand-stat-label">门店数量</span>
                                <span class="brand-stat-value">${storeCount} 家</span>
                            </div>
                            <div class="brand-stat-row">
                                <span class="brand-stat-label">桌位总数</span>
                                <span class="brand-stat-value">${tableCount} 张</span>
                            </div>
                            <div class="brand-stat-row">
                                <span class="brand-stat-label">收到反馈</span>
                                <span class="brand-stat-value">${feedbackCount} 条</span>
                            </div>
                            <div class="brand-stat-row">
                                <span class="brand-stat-label">平均评分</span>
                                <span class="brand-stat-value">${brandAvgRating === '暂无' ? brandAvgRating : brandAvgRating + ' ⭐'}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // 计算总体统计
            let totalTables = 0;
            stores.forEach(store => {
                totalTables += (store.tables ? store.tables.length : 0);
            });

            let totalRating = 0, ratingCount = 0;
            answers.forEach(a => {
                if (a.rating) {
                    totalRating += a.rating;
                    ratingCount++;
                }
            });
            const avgRating = ratingCount > 0 ? (totalRating / ratingCount).toFixed(1) : 0;

            // 更新总体统计数字
            document.getElementById('totalBrands').textContent = brands.length;
            document.getElementById('totalStores').textContent = stores.length;
            document.getElementById('totalTables').textContent = totalTables;
            document.getElementById('totalAnswers').textContent = answers.length;
            document.getElementById('avgRating').textContent = avgRating;
        });
    </script>
</body>
</html>
