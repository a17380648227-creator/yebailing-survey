<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计 - 野百灵餐厅</title>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .header {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            text-decoration: none;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .page-title p {
            color: #666;
            font-size: 14px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .filter-card {
            background: white;
            border-radius: 16px;
            padding: 20px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 600;
            color: #333;
        }

        .filter-group select {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .data-list {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .data-item {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .data-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        .data-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
            font-size: 14px;
        }

        .rating-stars {
            color: #fbbf24;
            font-size: 20px;
        }

        .data-content {
            margin-top: 15px;
        }

        .content-row {
            margin-bottom: 12px;
        }

        .content-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .content-value {
            color: #666;
            line-height: 1.6;
        }

        .improvement-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .tag {
            background: #f3f4f6;
            color: #374151;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        /* 图表样式 */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .chart-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-canvas {
            position: relative;
            height: 300px;
        }

        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="admin.html" class="logo">🍴 野百灵餐厅管理后台</a>
        <div style="color: #666;">数据统计</div>
    </div>

    <div class="container">
        <div class="page-title">
            <h1>📊 数据统计</h1>
            <p>查看顾客反馈数据和统计分析</p>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">💬</div>
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">总反馈数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-number" id="avgRating">0</div>
                <div class="stat-label">平均评分</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">😊</div>
                <div class="stat-number" id="goodCount">0</div>
                <div class="stat-label">好评数(≥4星)</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-number" id="todayCount">0</div>
                <div class="stat-label">今日反馈</div>
            </div>
        </div>

        <!-- 筛选器 -->
        <div class="filter-card">
            <div class="filter-group">
                <label>门店筛选：</label>
                <select id="storeFilter" onchange="filterData()">
                    <option value="">全部门店</option>
                </select>
            </div>
            <div class="filter-group">
                <label>评分筛选：</label>
                <select id="ratingFilter" onchange="filterData()">
                    <option value="">全部评分</option>
                    <option value="5">⭐⭐⭐⭐⭐ (5星)</option>
                    <option value="4">⭐⭐⭐⭐ (4星)</option>
                    <option value="3">⭐⭐⭐ (3星)</option>
                    <option value="2">⭐⭐ (2星)</option>
                    <option value="1">⭐ (1星)</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="exportData()">📥 导出数据</button>
                <button class="btn" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white;" onclick="clearFilteredData()">🗑️ 批量删除</button>
            </div>
        </div>

        <!-- 数据可视化图表 -->
        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-title">
                    📊 评分分布
                </div>
                <div class="chart-canvas">
                    <canvas id="ratingChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">
                    📈 每日反馈趋势（最近7天）
                </div>
                <div class="chart-canvas">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 数据列表 -->
        <div class="data-list">
            <div id="dataList"></div>
        </div>
    </div>

    <script>
        let allAnswers = [];
        let filteredAnswers = [];

        // 加载数据（从云端和本地）
        async function loadData() {
            console.log('🔄 正在加载问卷数据...');

            // 1. 先从本地加载
            allAnswers = JSON.parse(localStorage.getItem('ybl_answers') || '[]');
            console.log('📊 从本地读取:', allAnswers.length, '条');

            // 2. 尝试从云端同步
            const token = localStorage.getItem('github_token');
            const gistId = localStorage.getItem('cloud_gist_id');

            if (token && gistId && token !== 'YOUR_GITHUB_TOKEN') {
                try {
                    const cloudData = await fetchFromCloud(token, gistId);
                    if (cloudData && cloudData.length > 0) {
                        allAnswers = cloudData;
                        localStorage.setItem('ybl_answers', JSON.stringify(cloudData));
                        console.log('☁️ 从云端同步:', cloudData.length, '条');
                    }
                } catch (error) {
                    console.warn('⚠️ 云端同步失败，使用本地数据:', error.message);
                }
            }

            // 按时间倒序排列（最新的在前面）
            allAnswers.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            filteredAnswers = [...allAnswers];

            // 加载门店列表到筛选器
            const stores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');
            const storeFilter = document.getElementById('storeFilter');
            stores.forEach(store => {
                const option = document.createElement('option');
                option.value = store.name;
                option.textContent = store.name;
                storeFilter.appendChild(option);
            });

            updateStats();
            displayData();

            // 渲染图表
            renderRatingChart(allAnswers);
            renderTrendChart(allAnswers);
        }

        // 更新统计数据
        function updateStats() {
            const totalCount = filteredAnswers.length;

            // 计算平均评分
            let totalRating = 0;
            let ratingCount = 0;
            filteredAnswers.forEach(a => {
                if (a.rating) {
                    totalRating += a.rating;
                    ratingCount++;
                }
            });
            const avgRating = ratingCount > 0 ? (totalRating / ratingCount).toFixed(1) : 0;

            // 好评数
            const goodCount = filteredAnswers.filter(a => a.rating >= 4).length;

            // 今日反馈
            const today = new Date().toDateString();
            const todayCount = filteredAnswers.filter(a => {
                const answerDate = new Date(a.timestamp).toDateString();
                return answerDate === today;
            }).length;

            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('avgRating').textContent = avgRating;
            document.getElementById('goodCount').textContent = goodCount;
            document.getElementById('todayCount').textContent = todayCount;
        }

        // 显示数据
        function displayData() {
            const container = document.getElementById('dataList');

            if (filteredAnswers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div>还没有收到反馈数据</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredAnswers.map(answer => {
                const stars = '⭐'.repeat(answer.rating || 0);
                const date = new Date(answer.timestamp).toLocaleString('zh-CN');

                return `
                    <div class="data-item">
                        <div class="data-header">
                            <div class="data-meta">
                                <div class="meta-item">🏪 ${answer.store}</div>
                                <div class="meta-item">📋 ${answer.table}号桌</div>
                                <div class="meta-item">📅 ${date}</div>
                            </div>
                            <div class="rating-stars">${stars}</div>
                        </div>
                        <div class="data-content">
                            <div class="content-row">
                                <div class="content-label">用餐同伴：</div>
                                <div class="content-value">${answer.companion || '未填写'}</div>
                            </div>
                            ${answer.improvements && answer.improvements.length > 0 ? `
                                <div class="content-row">
                                    <div class="content-label">待改进项：</div>
                                    <div class="improvement-tags">
                                        ${answer.improvements.map(item => `<span class="tag">${item}</span>`).join('')}
                                    </div>
                                </div>
                            ` : ''}
                            ${answer.suggestions ? `
                                <div class="content-row">
                                    <div class="content-label">其他建议：</div>
                                    <div class="content-value">${answer.suggestions}</div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 筛选数据
        function filterData() {
            const storeFilter = document.getElementById('storeFilter').value;
            const ratingFilter = document.getElementById('ratingFilter').value;

            filteredAnswers = allAnswers.filter(answer => {
                let match = true;

                if (storeFilter && answer.store !== storeFilter) {
                    match = false;
                }

                if (ratingFilter && answer.rating !== parseInt(ratingFilter)) {
                    match = false;
                }

                return match;
            });

            updateStats();
            displayData();

            // 更新图表以反映筛选后的数据
            renderRatingChart(filteredAnswers);
            renderTrendChart(filteredAnswers);
        }

        // 导出数据
        function exportData() {
            if (filteredAnswers.length === 0) {
                alert('❌ 没有数据可以导出');
                return;
            }

            // 转换为CSV格式
            const headers = ['门店', '桌号', '提交时间', '用餐同伴', '评分', '待改进项', '其他建议'];
            const rows = filteredAnswers.map(answer => [
                answer.store,
                answer.table + '号桌',
                new Date(answer.timestamp).toLocaleString('zh-CN'),
                answer.companion || '',
                answer.rating || '',
                (answer.improvements || []).join('、'),
                answer.suggestions || ''
            ]);

            let csvContent = headers.join(',') + '\n';
            rows.forEach(row => {
                csvContent += row.map(cell => `"${cell}"`).join(',') + '\n';
            });

            // 创建下载链接
            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `野百灵反馈数据_${new Date().toLocaleDateString()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 批量删除筛选后的数据
        function clearFilteredData() {
            if (filteredAnswers.length === 0) {
                alert('❌ 没有数据可以删除');
                return;
            }

            // 构建确认消息
            const filterInfo = [];
            const storeFilter = document.getElementById('storeFilter').value;
            const ratingFilter = document.getElementById('ratingFilter').value;

            if (storeFilter) filterInfo.push(`门店: ${storeFilter}`);
            if (ratingFilter) filterInfo.push(`评分: ${ratingFilter}星`);

            const filterDesc = filterInfo.length > 0
                ? `\n筛选条件: ${filterInfo.join(', ')}`
                : '\n当前筛选: 全部数据';

            if (!confirm(`⚠️ 确定要删除这些反馈数据吗？${filterDesc}\n\n共 ${filteredAnswers.length} 条数据\n\n此操作不可恢复！\n\n建议先导出备份！`)) {
                return;
            }

            // 二次确认
            if (!confirm(`最后确认：真的要删除 ${filteredAnswers.length} 条反馈吗？`)) {
                return;
            }

            // 获取要删除的时间戳列表
            const timestampsToDelete = new Set(filteredAnswers.map(a => a.timestamp));

            // 从所有数据中过滤掉要删除的数据
            const remainingAnswers = allAnswers.filter(a => !timestampsToDelete.has(a.timestamp));

            // 保存到localStorage
            localStorage.setItem('ybl_answers', JSON.stringify(remainingAnswers));

            // 同步到云端
            const token = localStorage.getItem('github_token');
            const gistId = localStorage.getItem('cloud_gist_id');
            if (token && gistId && token !== 'YOUR_GITHUB_TOKEN') {
                syncToCloud(remainingAnswers, token, gistId).catch(err => {
                    console.warn('云端同步失败:', err);
                });
            }

            // 显示成功消息
            showToast(`✅ 已删除 ${filteredAnswers.length} 条反馈数据`);

            // 刷新页面
            setTimeout(() => location.reload(), 1500);
        }

        // 同步到云端
        async function syncToCloud(data, token, gistId) {
            const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    files: {
                        'feedbacks.json': {
                            content: JSON.stringify(data, null, 2)
                        }
                    }
                })
            });

            if (!response.ok) throw new Error('云端同步失败');
        }

        // 显示Toast提示
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: ${type === 'success' ? 'rgba(16, 185, 129, 0.95)' : 'rgba(239, 68, 68, 0.95)'};
                color: white;
                padding: 20px 40px;
                border-radius: 16px;
                font-size: 18px;
                font-weight: bold;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);
                z-index: 10000;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // 页面加载时加载数据
        // 自动刷新数据（每5秒检查一次新数据）
        let autoRefreshInterval = null;

        function startAutoRefresh() {
            autoRefreshInterval = setInterval(() => {
                const newData = JSON.parse(localStorage.getItem('ybl_answers') || '[]');
                if (newData.length !== allAnswers.length) {
                    console.log('🔄 检测到新数据，自动刷新...');
                    loadData();
                }
            }, 5000); // 每5秒检查一次
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        }

        // 图表实例
        let ratingChartInstance = null;
        let trendChartInstance = null;

        // 渲染评分分布图表
        function renderRatingChart(answers) {
            const ratingCounts = [0, 0, 0, 0, 0]; // 1-5星
            answers.forEach(answer => {
                if (answer.rating >= 1 && answer.rating <= 5) {
                    ratingCounts[answer.rating - 1]++;
                }
            });

            const ctx = document.getElementById('ratingChart');
            if (!ctx) return;

            // 销毁旧图表
            if (ratingChartInstance) {
                ratingChartInstance.destroy();
            }

            ratingChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['1星', '2星', '3星', '4星', '5星'],
                    datasets: [{
                        data: ratingCounts,
                        backgroundColor: [
                            '#ef4444', // 红色
                            '#f97316', // 橙色
                            '#f59e0b', // 黄色
                            '#3b82f6', // 蓝色
                            '#10b981'  // 绿色
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 15,
                                font: {
                                    size: 13
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.parsed || 0;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                    return `${label}: ${value}条 (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // 渲染趋势图表
        function renderTrendChart(answers) {
            // 获取最近7天的日期
            const days = [];
            const counts = [];
            const today = new Date();

            for (let i = 6; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                days.push(`${date.getMonth() + 1}/${date.getDate()}`);

                // 统计该天的反馈数
                const count = answers.filter(answer => {
                    const answerDate = new Date(answer.timestamp).toISOString().split('T')[0];
                    return answerDate === dateStr;
                }).length;
                counts.push(count);
            }

            const ctx = document.getElementById('trendChart');
            if (!ctx) return;

            // 销毁旧图表
            if (trendChartInstance) {
                trendChartInstance.destroy();
            }

            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [{
                        label: '反馈数量',
                        data: counts,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4,
                        fill: true,
                        borderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#3b82f6',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                label: function(context) {
                                    return `反馈: ${context.parsed.y}条`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1,
                                precision: 0
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }

        // 从云端获取数据
        async function fetchFromCloud(token, gistId) {
            const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!response.ok) throw new Error('Fetch failed');

            const gist = await response.json();
            const content = gist.files['feedbacks.json'].content;
            return JSON.parse(content);
        }

        window.addEventListener('load', () => {
            loadData();
            startAutoRefresh(); // 启动自动刷新
        });

        // 页面卸载时停止自动刷新
        window.addEventListener('beforeunload', stopAutoRefresh);
    </script>
</body>
</html>
