<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据导入工具 - 野百灵问卷系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .warning {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #856404;
            border-left: 4px solid #ffc107;
        }

        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #1976d2;
        }

        .upload-area {
            background: white;
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9fa;
        }

        .upload-area.dragover {
            background: #e3f2fd;
            border-color: #1976d2;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #666;
            font-size: 16px;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .data-summary {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            display: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .success {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error {
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .progress {
            background: #f0f0f0;
            border-radius: 10px;
            height: 30px;
            margin-top: 20px;
            display: none;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .checkbox-group {
            margin: 15px 0;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
        }

        .checkbox-label input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 数据导入工具</h1>
        <p class="subtitle">从旧主机导出的 JSON 文件恢复数据到新主机</p>

        <div class="section">
            <h2>⚠️ 重要提示</h2>
            <div class="warning">
                <strong>注意：</strong>导入数据会覆盖当前浏览器中的所有数据！<br>
                如果新主机已有数据，请先导出备份，再进行导入操作。
            </div>
        </div>

        <div class="section">
            <h2>📤 选择数据文件</h2>
            <div class="info">
                请选择从旧主机导出的 data-backup.json 文件
            </div>

            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击选择文件 或 拖拽文件到这里</div>
                <div class="upload-text" style="font-size: 14px; margin-top: 10px; color: #999;">
                    支持 .json 文件
                </div>
            </div>

            <input type="file" id="fileInput" accept=".json" onchange="handleFileSelect(event)">

            <div class="file-info" id="fileInfo">
                <div class="file-name" id="fileName"></div>
                <div class="data-summary" id="dataSummary"></div>
            </div>
        </div>

        <div class="section" id="optionsSection" style="display: none;">
            <h2>🔧 导入选项</h2>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="importStores" checked>
                    <span>导入门店信息</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="importAnswers" checked>
                    <span>导入问卷反馈</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="importAccounts" checked>
                    <span>导入账户信息</span>
                </label>
            </div>
        </div>

        <button class="btn" id="importBtn" onclick="importData()">
            📥 开始导入数据
        </button>

        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div class="success" id="successMsg"></div>
        <div class="error" id="errorMsg"></div>

        <div class="section" style="margin-top: 30px;">
            <h2>📝 使用说明</h2>
            <div style="font-size: 14px; color: #666; line-height: 1.8;">
                <p><strong>1. 在旧主机上使用 export-data.html 导出数据</strong></p>
                <p><strong>2. 在这个页面上传导出的 JSON 文件</strong></p>
                <p><strong>3. 确认要导入的数据类型</strong></p>
                <p><strong>4. 点击"开始导入数据"按钮完成迁移</strong></p>
                <p style="margin-top: 15px; color: #f44336;">
                    <strong>⚠️ 导入后需要刷新页面才能看到新数据</strong>
                </p>
            </div>
        </div>
    </div>

    <script>
        let fileData = null;

        // 拖拽上传
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            if (!file.name.endsWith('.json')) {
                showError('请选择 JSON 格式的文件');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    fileData = JSON.parse(e.target.result);
                    displayFileInfo(file.name, fileData);
                } catch (error) {
                    showError('文件格式错误: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        function displayFileInfo(fileName, data) {
            document.getElementById('fileName').textContent = '📄 ' + fileName;

            const stores = data.data?.stores || [];
            const answers = data.data?.answers || [];
            const accounts = data.data?.accounts || [];

            const summary = `
                <strong>文件信息：</strong><br>
                • 导出时间：${new Date(data.exportDate).toLocaleString('zh-CN')}<br>
                • 版本：${data.version}<br><br>
                <strong>包含数据：</strong><br>
                • 门店信息：${stores.length} 条<br>
                • 问卷反馈：${answers.length} 条<br>
                • 账户信息：${accounts.length} 条
            `;

            document.getElementById('dataSummary').innerHTML = summary;
            document.getElementById('fileInfo').style.display = 'block';
            document.getElementById('optionsSection').style.display = 'block';
            document.getElementById('importBtn').style.display = 'block';
        }

        function importData() {
            if (!fileData) {
                showError('请先选择文件');
                return;
            }

            const importStores = document.getElementById('importStores').checked;
            const importAnswers = document.getElementById('importAnswers').checked;
            const importAccounts = document.getElementById('importAccounts').checked;

            if (!importStores && !importAnswers && !importAccounts) {
                showError('请至少选择一项要导入的数据');
                return;
            }

            // 显示进度条
            document.getElementById('progress').style.display = 'block';
            document.getElementById('importBtn').disabled = true;

            try {
                let progress = 0;
                updateProgress(0);

                // 导入门店信息
                if (importStores && fileData.data.stores) {
                    localStorage.setItem('ybl_stores', JSON.stringify(fileData.data.stores));
                    progress += 33;
                    updateProgress(progress);
                }

                // 导入问卷反馈
                if (importAnswers && fileData.data.answers) {
                    localStorage.setItem('ybl_answers', JSON.stringify(fileData.data.answers));
                    progress += 33;
                    updateProgress(progress);
                }

                // 导入账户信息
                if (importAccounts && fileData.data.accounts) {
                    localStorage.setItem('ybl_accounts', JSON.stringify(fileData.data.accounts));
                    progress += 34;
                    updateProgress(progress);
                }

                // 导入其他配置
                if (fileData.data.currentBrand) {
                    localStorage.setItem('currentBrand', fileData.data.currentBrand);
                }
                if (fileData.data.adminPassword) {
                    localStorage.setItem('adminPassword', fileData.data.adminPassword);
                }

                updateProgress(100);

                // 显示成功消息
                setTimeout(() => {
                    const importedItems = [];
                    if (importStores) importedItems.push(`${fileData.data.stores.length} 个门店`);
                    if (importAnswers) importedItems.push(`${fileData.data.answers.length} 条反馈`);
                    if (importAccounts) importedItems.push(`${fileData.data.accounts.length} 个账户`);

                    showSuccess(`✅ 导入成功！已导入 ${importedItems.join('、')}。<br><br>
                        <strong>请刷新页面查看数据</strong><br><br>
                        <button onclick="location.href='admin.html'" style="background: white; color: #4caf50; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: 600;">
                            前往后台管理
                        </button>`);

                    document.getElementById('progress').style.display = 'none';
                }, 500);

            } catch (error) {
                console.error('导入失败:', error);
                showError('导入失败: ' + error.message);
                document.getElementById('importBtn').disabled = false;
                document.getElementById('progress').style.display = 'none';
            }
        }

        function updateProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = percent + '%';
            progressBar.textContent = Math.round(percent) + '%';
        }

        function showSuccess(message) {
            const successMsg = document.getElementById('successMsg');
            successMsg.innerHTML = message;
            successMsg.style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '❌ ' + message;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
