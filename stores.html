<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>门店管理 - 野百灵餐厅</title>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: white;
        }
        .main-container { max-width: 1400px; margin: 0 auto; padding: 40px 30px; }
        .page-header { margin-bottom: 40px; text-align: center; }
        .page-title {
            font-size: 48px; font-weight: 800;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #ef4444 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 12px;
        }
        .page-subtitle { font-size: 16px; color: rgba(255, 255, 255, 0.7); }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(147, 197, 253, 0.2);
            margin-bottom: 30px;
        }
        .card-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-section { margin-bottom: 25px; }
        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .form-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(147, 197, 253, 0.3);
            border-radius: 16px;
            font-size: 16px;
            color: white;
            transition: all 0.3s;
        }
        .form-input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.15);
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.5);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: 10px 20px;
            font-size: 14px;
        }
        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
        }

        .store-item {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(147, 197, 253, 0.2);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            transition: all 0.3s;
        }
        .store-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.2);
        }

        .store-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .store-name {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .store-actions {
            display: flex;
            gap: 10px;
        }

        .table-section { margin-top: 20px; }
        .table-section-title {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .batch-actions {
            display: flex;
            gap: 10px;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .table-item {
            background: rgba(59, 130, 246, 0.15);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.3s;
        }
        .table-item:hover {
            background: rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-name {
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        .table-actions {
            display: flex;
            gap: 6px;
        }

        .btn-icon {
            background: rgba(139, 92, 246, 0.8);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-icon:hover {
            background: #8b5cf6;
            transform: translateY(-2px);
        }

        .btn-delete-table {
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-delete-table:hover { background: #ef4444; }

        .qrcode-section {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-top: 10px;
        }
        .qrcode-section.show { display: flex; }
        .qrcode-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        .add-table-section {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-top: 15px;
        }
        .add-table-input {
            flex: 1;
            max-width: 300px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.6);
        }
        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <script src="navbar.js"></script>
    <script>insertNavbar('stores.html');</script>

    <div class="main-container">
        <div class="page-header">
            <h1 class="page-title">🏪 门店管理</h1>
            <p class="page-subtitle">管理门店、桌位和二维码</p>
        </div>

        <!-- 添加门店 -->
        <div class="card">
            <h2 class="card-title">
                <span>➕</span>
                添加新门店
            </h2>
            <div class="form-section">
                <label class="form-label">所属品牌</label>
                <select id="newStoreBrand" class="form-input" style="cursor: pointer;">
                    <option value="">请选择品牌</option>
                </select>
            </div>
            <div class="form-section">
                <label class="form-label">门店名称</label>
                <input type="text" id="newStoreName" class="form-input" placeholder="例如：朝阳店、三里屯店">
            </div>
            <button class="btn btn-primary" onclick="addStore()">✨ 添加门店</button>
        </div>

        <!-- 门店列表 -->
        <div class="card">
            <h2 class="card-title">
                <span>📋</span>
                门店列表
            </h2>
            <div class="form-section" style="max-width: 400px; margin-bottom: 25px;">
                <label class="form-label">按品牌筛选</label>
                <select id="brandFilter" class="form-input" style="cursor: pointer;" onchange="loadStores()">
                    <option value="">全部品牌</option>
                </select>
            </div>
            <div id="storesList"></div>
        </div>
    </div>

    <script>
        const qrCodeInstances = {};

        // ⚙️ 网站配置：部署到 GitHub Pages 后，修改这里的网址
        const SITE_URL = localStorage.getItem('ybl_site_url') || 'https://a17380648227-creator.github.io/yebailing-survey';

        // 加载品牌列表到下拉框
        function loadBrandOptions() {
            const brands = JSON.parse(localStorage.getItem('ybl_brands') || '[]');

            // 加载添加门店的品牌选择
            const newStoreBrand = document.getElementById('newStoreBrand');
            newStoreBrand.innerHTML = '<option value="">请选择品牌</option>' +
                brands.map(b => `<option value="${b.id}">${b.name}</option>`).join('');

            // 加载筛选的品牌选择
            const brandFilter = document.getElementById('brandFilter');
            brandFilter.innerHTML = '<option value="">全部品牌</option>' +
                brands.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        }

        // 加载门店列表
        function loadStores() {
            const allStores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');
            const container = document.getElementById('storesList');

            // 获取品牌筛选
            const brandFilter = document.getElementById('brandFilter');
            const selectedBrandId = brandFilter ? brandFilter.value : '';

            // 筛选门店
            const stores = selectedBrandId
                ? allStores.filter(s => String(s.brandId) === selectedBrandId)
                : allStores;

            if (allStores.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🏪</div>
                        <div>还没有添加门店，先去<a href="brands.html" style="color: #3b82f6; text-decoration: underline;">品牌管理</a>添加品牌，再添加门店吧！</div>
                    </div>
                `;
                return;
            }

            if (stores.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div>该品牌下还没有门店</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = stores.map((store, storeIndex) => {
                const tableCount = store.tables ? store.tables.length : 0;
                const createdDate = new Date(store.createdAt).toLocaleString('zh-CN');

                // 获取真实的索引（在完整列表中的位置）
                const realIndex = allStores.findIndex(s => s.id === store.id);

                return `
                    <div class="store-item">
                        <div class="store-header">
                            <div>
                                <div style="font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 5px;">
                                    🏢 ${store.brandName || '未分配品牌'}
                                </div>
                                <div class="store-name">${store.name}</div>
                            </div>
                            <div class="store-actions">
                                <button class="btn btn-success btn-small" onclick="editStore(${realIndex})">
                                    ✏️ 编辑
                                </button>
                                <button class="btn btn-danger" onclick="deleteStore(${realIndex})">
                                    🗑️ 删除
                                </button>
                            </div>
                        </div>

                        <div class="table-section">
                            <div class="table-section-title">
                                <span>📋 桌位列表（${tableCount} 张）</span>
                                <div class="batch-actions">
                                    <button class="btn btn-success btn-small" onclick="batchAddTables(${storeIndex})">
                                        ⚡ 批量添加
                                    </button>
                                    ${tableCount > 0 ? `
                                    <button class="btn btn-primary btn-small" onclick="batchDownloadQR(${storeIndex})">
                                        📦 批量下载二维码
                                    </button>
                                    ` : ''}
                                </div>
                            </div>

                            ${store.tables && store.tables.length > 0 ? `
                                <div class="table-grid">
                                    ${store.tables.map((table, tableIndex) => `
                                        <div class="table-item">
                                            <div class="table-header">
                                                <span class="table-name">${table}</span>
                                                <div class="table-actions">
                                                    <button class="btn-icon" onclick="generateQRCode('${store.name}', '${table}', ${storeIndex}, ${tableIndex})">
                                                        📱 生成
                                                    </button>
                                                    <button class="btn-delete-table" onclick="deleteTable(${storeIndex}, ${tableIndex})">
                                                        ✕
                                                    </button>
                                                </div>
                                            </div>
                                            <div class="qrcode-section" id="qr-section-${storeIndex}-${tableIndex}">
                                                <div class="qrcode-container" id="qrcode-${storeIndex}-${tableIndex}"></div>
                                                <button class="btn btn-success btn-small" onclick="downloadQRCode('${store.name}', '${table}', ${storeIndex}, ${tableIndex})">
                                                    💾 下载
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : '<div style="color: rgba(255,255,255,0.5); margin-bottom: 15px;">暂无桌位</div>'}

                            <div class="add-table-section">
                                <div class="add-table-input">
                                    <input type="text"
                                           id="newTable_${storeIndex}"
                                           class="form-input"
                                           placeholder="输入桌号，如：A1, VIP1"
                                           style="padding: 12px 16px;">
                                </div>
                                <button class="btn btn-success btn-small" onclick="addTable(${storeIndex})">
                                    ➕ 添加桌号
                                </button>
                            </div>
                        </div>

                        <div style="margin-top: 15px; font-size: 13px; color: rgba(255,255,255,0.5);">
                            创建时间：${createdDate}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 添加门店
        function addStore() {
            const brandSelect = document.getElementById('newStoreBrand');
            const brandId = brandSelect.value;
            const name = document.getElementById('newStoreName').value.trim();

            if (!brandId) {
                alert('❌ 请选择所属品牌');
                return;
            }

            if (!name) {
                alert('❌ 请输入门店名称');
                return;
            }

            // 获取品牌名称
            const brands = JSON.parse(localStorage.getItem('ybl_brands') || '[]');
            const brand = brands.find(b => String(b.id) === brandId);

            if (!brand) {
                alert('❌ 品牌不存在，请刷新页面');
                return;
            }

            const stores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');

            const newStore = {
                id: Date.now(),
                brandId: Number(brandId),
                brandName: brand.name,
                name: name,
                tables: [],
                createdAt: new Date().toISOString()
            };

            stores.push(newStore);
            localStorage.setItem('ybl_stores', JSON.stringify(stores));

            document.getElementById('newStoreName').value = '';
            brandSelect.value = '';
            loadStores();

            showToast(`✅ 门店"${brand.name} - ${name}"添加成功！`);
        }

        // Toast提示
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: ${type === 'success' ? 'rgba(16, 185, 129, 0.95)' : 'rgba(239, 68, 68, 0.95)'};
                color: white;
                padding: 20px 40px;
                border-radius: 16px;
                font-size: 18px;
                font-weight: bold;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);
                z-index: 10000;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // 编辑门店
        function editStore(index) {
            const stores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');
            const newName = prompt('请输入新的门店名称：', stores[index].name);

            if (newName && newName.trim()) {
                stores[index].name = newName.trim();
                localStorage.setItem('ybl_stores', JSON.stringify(stores));
                loadStores();
            }
        }

        // 删除门店
        function deleteStore(index) {
            const stores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');
            const storeName = stores[index].name;

            if (!confirm(`⚠️ 确定要删除门店"${storeName}"吗？删除后该门店的所有数据将无法恢复！`)) {
                return;
            }

            stores.splice(index, 1);
            localStorage.setItem('ybl_stores', JSON.stringify(stores));
            loadStores();
        }

        // 添加桌号
        function addTable(storeIndex) {
            const inputId = `newTable_${storeIndex}`;
            const tableName = document.getElementById(inputId).value.trim();

            if (!tableName) {
                alert('❌ 请输入桌号');
                return;
            }

            const stores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');

            if (!stores[storeIndex].tables) {
                stores[storeIndex].tables = [];
            }

            // 检查是否重复
            if (stores[storeIndex].tables.includes(tableName)) {
                alert('❌ 该桌号已存在');
                return;
            }

            stores[storeIndex].tables.push(tableName);
            localStorage.setItem('ybl_stores', JSON.stringify(stores));

            document.getElementById(inputId).value = '';
            loadStores();
        }

        // 批量添加桌号
        function batchAddTables(storeIndex) {
            const prefix = prompt('请输入桌号前缀（可选，如：A、VIP）：', '');
            const start = prompt('请输入起始桌号：', '1');
            const end = prompt('请输入结束桌号：', '20');

            if (start === null || end === null) return;

            const startNum = parseInt(start);
            const endNum = parseInt(end);

            if (isNaN(startNum) || isNaN(endNum) || startNum > endNum) {
                alert('❌ 请输入有效的桌号范围');
                return;
            }

            const stores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');

            if (!stores[storeIndex].tables) {
                stores[storeIndex].tables = [];
            }

            let addedCount = 0;
            for (let i = startNum; i <= endNum; i++) {
                const tableName = prefix ? `${prefix}${i}` : String(i);
                if (!stores[storeIndex].tables.includes(tableName)) {
                    stores[storeIndex].tables.push(tableName);
                    addedCount++;
                }
            }

            localStorage.setItem('ybl_stores', JSON.stringify(stores));

            alert(`✅ 成功添加 ${addedCount} 个桌号`);
            loadStores();
        }

        // 删除桌号
        function deleteTable(storeIndex, tableIndex) {
            const stores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');
            const tableName = stores[storeIndex].tables[tableIndex];

            if (!confirm(`⚠️ 确定要删除桌号"${tableName}"吗？`)) {
                return;
            }

            stores[storeIndex].tables.splice(tableIndex, 1);
            localStorage.setItem('ybl_stores', JSON.stringify(stores));
            loadStores();
        }

        // 生成二维码
        function generateQRCode(storeName, tableName, storeIndex, tableIndex) {
            try {
                if (typeof QRCode === 'undefined') {
                    alert('❌ 二维码库未加载，请刷新页面重试');
                    return;
                }

                const sectionId = `qr-section-${storeIndex}-${tableIndex}`;
                const containerId = `qrcode-${storeIndex}-${tableIndex}`;
                const section = document.getElementById(sectionId);
                const container = document.getElementById(containerId);

                if (!section || !container) {
                    alert('❌ 页面元素未找到');
                    return;
                }

                // 清空之前的二维码
                container.innerHTML = '';
                const key = `${storeIndex}-${tableIndex}`;
                if (qrCodeInstances[key]) {
                    delete qrCodeInstances[key];
                }

                // 获取门店信息（包含品牌）
                const stores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');
                const store = stores.find(s => s.name === storeName);
                const brandName = store ? store.brandName : '';

                // 构造问卷URL（添加品牌参数）
                const url = brandName
                    ? `${SITE_URL}/survey.html?b=${encodeURIComponent(brandName)}&s=${encodeURIComponent(storeName)}&t=${encodeURIComponent(tableName)}`
                    : `${SITE_URL}/survey.html?s=${encodeURIComponent(storeName)}&t=${encodeURIComponent(tableName)}`;

                // 生成二维码
                qrCodeInstances[key] = new QRCode(container, {
                    text: url,
                    width: 150,
                    height: 150,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });

                // 显示二维码区域
                section.classList.add('show');
            } catch (error) {
                alert(`❌ 生成二维码失败: ${error.message}`);
            }
        }

        // 下载二维码
        function downloadQRCode(storeName, tableName, storeIndex, tableIndex) {
            const containerId = `qrcode-${storeIndex}-${tableIndex}`;
            const container = document.getElementById(containerId);
            const canvas = container.querySelector('canvas');

            if (canvas) {
                const url = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = url;
                link.download = `${storeName}_${tableName}.png`;
                link.click();
            } else {
                alert('❌ 请先生成二维码');
            }
        }

        // 批量下载二维码
        async function batchDownloadQR(storeIndex) {
            if (typeof JSZip === 'undefined') {
                alert('❌ JSZip库未加载，无法批量下载');
                return;
            }

            const stores = JSON.parse(localStorage.getItem('ybl_stores') || '[]');
            const store = stores[storeIndex];

            if (!store.tables || store.tables.length === 0) {
                alert('❌ 该门店没有桌位');
                return;
            }

            if (!confirm(`确定要批量生成并下载 ${store.tables.length} 个二维码吗？`)) {
                return;
            }

            const zip = new JSZip();

            // 创建一个临时容器
            const tempContainer = document.createElement('div');
            tempContainer.style.display = 'none';
            document.body.appendChild(tempContainer);

            for (const tableName of store.tables) {
                const qrContainer = document.createElement('div');
                tempContainer.appendChild(qrContainer);

                // 生成二维码（添加品牌参数）
                const url = store.brandName
                    ? `${SITE_URL}/survey.html?b=${encodeURIComponent(store.brandName)}&s=${encodeURIComponent(store.name)}&t=${encodeURIComponent(tableName)}`
                    : `${SITE_URL}/survey.html?s=${encodeURIComponent(store.name)}&t=${encodeURIComponent(tableName)}`;
                const qr = new QRCode(qrContainer, {
                    text: url,
                    width: 300,
                    height: 300,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });

                // 等待二维码生成
                await new Promise(resolve => setTimeout(resolve, 100));

                // 获取canvas并转换为blob
                const canvas = qrContainer.querySelector('canvas');
                if (canvas) {
                    const dataUrl = canvas.toDataURL('image/png');
                    const base64Data = dataUrl.split(',')[1];
                    zip.file(`${store.name}_${tableName}.png`, base64Data, {base64: true});
                }
            }

            // 清理临时容器
            document.body.removeChild(tempContainer);

            // 生成ZIP并下载
            const content = await zip.generateAsync({type: 'blob'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `${store.name}_二维码.zip`;
            link.click();

            alert(`✅ 成功生成 ${store.tables.length} 个二维码！`);
        }

        // 页面加载时加载品牌和门店列表
        window.addEventListener('load', () => {
            loadBrandOptions();
            loadStores();
        });
    </script>
</body>
</html>
